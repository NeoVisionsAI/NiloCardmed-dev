[project]
name = "nilocardmed"
version = "0.1.0"
description = "Captura y envío de imágenes desde Raspberry Pi Zero W2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "httpx>=0.27,<1",
]

[project.scripts]
nilocardmed = "nilocardmed.main:main"
nilocardmed-camera = "nilocardmed.camera.cli:main"
nilocardmed-ser = "nilocardmed.ser_client.cli:main"
nilocardmed-sampler = "nilocardmed.sampler.cli:main"
nilocardmed-wifi = "nilocardmed.wifi.cli:main"
nilocardmed-bluetooth = "nilocardmed.bluetooth.cli:main"
nilocardmed-cardmed = "nilocardmed.cardmed.cli:main"
nilocardmed-health = "nilocardmed.resilience.cli:main"

[project.optional-dependencies]
ble = ["bluezero>=0.7,<1"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nilocardmed*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
