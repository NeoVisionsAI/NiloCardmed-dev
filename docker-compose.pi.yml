# Extensiones de hardware para Raspberry Pi Zero W2.
# Combinar con: COMPOSE_FILE=docker-compose.yml:docker-compose.pi.yml
# Cámara USB, bus USB y D-Bus se configuran en docker-compose.override.yml
# (scripts/generate-compose-override.sh) según hardware detectado y deploy.env.

services:
  nilocardmed:
    cap_add:
      - SYS_TIME
    group_add:
      - ${CONTAINER_GROUP_ADD:-video}
    # Pi Zero W2: limitar RAM para evitar OOM en el host (~512 MiB total)
    deploy:
      resources:
        limits:
          memory: ${CONTAINER_MEMORY_LIMIT:-384M}
    shm_size: ${CONTAINER_SHM_SIZE:-64m}
    environment:
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
      PYTHONUNBUFFERED: "1"
